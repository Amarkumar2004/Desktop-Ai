[package]
name = "susi-ai"
version = "0.1.0"
description = "SUSI AI Assistant Desktop App"
authors = ["SUSI Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
winreg = "0.52"
arboard = "3.4"
keyring = "2.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = false
codegen-units = 1

[profile.dev.build-override]
opt-level = 0
codegen-units = 1


